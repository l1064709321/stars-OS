name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Configure Cargo linker for Android
        run: |
          LINKER_PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LINKER_PATH" >> $GITHUB_ENV
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$LINKER_PATH"
          EOF

      - name: Build Rust .so
        run: |
          cargo build -p quantum-core --release --target aarch64-linux-android 2>&1 | tail -30

      - name: Copy libquantum_core.so to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libquantum_core.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK with Gradle 8.7
        working-directory: android
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt
          export PATH=/opt/gradle-8.7/bin:$PATH
          gradle --version
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -60

      - uses: actions/upload-artifact@v4
        with:
          name: starsos-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
