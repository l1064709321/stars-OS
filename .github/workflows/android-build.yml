name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Configure Cargo linker for Android
        run: |
          # Determine absolute path to the NDK clang driver we'll use as the linker.
          LINKER_PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"

          # Export for subsequent steps so cargo/rustc uses it
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LINKER_PATH" >> $GITHUB_ENV

          # Write repository-level cargo config so cargo picks up the linker setting
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$LINKER_PATH"
          EOF

          # Debug: show that the linker exists
          ls -l "$LINKER_PATH" || true

      - name: Build Rust + APK
        run: |
          rustup target add aarch64-linux-android
          cargo build -p quantum-core --release --target aarch64-linux-android
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: starsos-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
